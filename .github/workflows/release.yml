name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const actual = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (actual !== expected) {
              throw new Error(`package.json has ${actual}; expected ${expected}`);
          }
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance
